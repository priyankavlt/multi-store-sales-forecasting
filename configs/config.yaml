# Central configuration for the sales forecasting pipeline.
# Every path is relative to the project root unless absolute.

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  artifacts_dir: artifacts
  reports_dir: reports

data:
  # Public mirror of the 1C Company retail dataset (no credentials required).
  source_url: https://raw.githubusercontent.com/hse-aml/competitive-data-science/master/readonly/final_project_data
  files:
    sales: sales_train.csv.gz
    items: items.csv
    categories: item_categories.csv
    shops: shops.csv
    test: test.csv.gz

cleaning:
  max_item_cnt_day: 1000      # single-day quantities above this are data-entry errors
  max_item_price: 100000      # prices above this are single anomalous transactions
  # Shops that appear under two ids (same address, renamed). Maps old id -> canonical id.
  shop_id_map:
    0: 57
    1: 58
    11: 10

features:
  target_clip: [0, 20]        # monthly target is clipped to this range (matches the evaluation protocol)
  min_month: 12               # first month kept in the training table (gives full 12-month lag history)
  target_lags: [1, 2, 3, 6, 12]
  aggregate_lags: [1, 2, 3]
  min_item_name_group: 20     # item-name groups with fewer items collapse to "other"

training:
  # The last observed month is held out for validation; the next month is the forecast horizon.
  backtest_months: [31, 32, 33]
  refit_on_full_history: true
  sample_for_linear_baseline: 1000000
  random_state: 42
  num_boost_round: 1500
  early_stopping_rounds: 50
  lgbm_params:
    objective: regression
    metric: rmse
    learning_rate: 0.05
    num_leaves: 255
    min_data_in_leaf: 100
    feature_fraction: 0.75
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    # Regularise categorical splits (shop_id / category ids overfit otherwise).
    cat_smooth: 50
    cat_l2: 50
    max_cat_threshold: 16
    min_data_per_group: 500
    max_bin: 255
    verbosity: -1

monitoring:
  # Row-level features: Population Stability Index.
  psi_warning: 0.1
  psi_alert: 0.25
  # Group-level aggregates (few distinct values per month): relative change of the mean.
  mean_shift_warning: 0.25
  mean_shift_alert: 0.5
